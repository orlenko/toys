<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, a list of toys. */
:root {
  --bg: #d9dddb; --panel: #eef0ee; --line: #b9c0bd; --fg: #1b2124; --muted: #5b6669; --accent: #2f6a49;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111415; --panel: #1a1f20; --line: #2d3537; --fg: #dde3e0; --muted: #8e9a9c; --accent: #6fbf8e; color-scheme: dark; }
}
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.5; }
main { max-width: 680px; margin: 0 auto; padding-inline: 20px; padding-block: 48px; display: grid; gap: 28px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 46px; line-height: 1; margin: 0; letter-spacing: .02em; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.toy { display: grid; gap: 4px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; color: inherit; text-decoration: none; }
a.toy:hover, a.toy:focus-visible { border-color: var(--accent); outline: none; }
a.toy b { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: .03em; color: var(--accent); }
a.toy span { color: var(--muted); }
footer { font-family: var(--mono); font-size: 12px; color: var(--muted); }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Browser toys &amp; components</div>
    <h1>Toys</h1>
  </header>
  <ul>
    <li>
      <a class="toy" href="chart-recorder/">
        <b>Model 209 Recorder</b>
        <span>A circular chart recorder web component that keeps several turns of history and colours the trace by age.</span>
      </a>
    </li>
  </ul>
  <footer>Licensed under the <a href="LICENSE">GNU GPL v3</a>.</footer>
</main>
</body>
</html>
